# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --repo examples/frame_index --out artifacts/frame_index --llm off --tts auto"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "Requires ffmpeg, ffprobe, and git on PATH. The run command builds a video under one minute from examples/frame_index, with no API key. --tts auto reads narration.txt with the edge-tts neural voice en-US-GuyNeural when network is available, and still writes a silent video if that service cannot be reached. --tts off skips speech. Pass a GitHub URL to --repo to clone and generate from that repository. Set DEVVIDEO_LLM_API_KEY (optional DEVVIDEO_LLM_BASE_URL and DEVVIDEO_LLM_MODEL) to write narration with an LLM; without a key the grounded composer uses only retrieved evidence. The model may cite evidence ids only, and any number in the script must appear in those cards. DEVVIDEO_TTS_VOICE overrides the voice. Output is artifacts/<name>/developer-video.mp4 plus evidence.json, script.json, narration.txt, and audio/narration.wav when speech is generated."
